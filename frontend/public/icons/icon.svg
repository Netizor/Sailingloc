<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fond océan -->
  <rect width="512" height="512" rx="112" fill="#0369a1"/>
  <!-- Ancre (inspirée de Lucide Anchor, simplifiée) -->
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Anneau du haut -->
    <circle cx="0" cy="-110" r="30"/>
    <!-- Tige verticale -->
    <line x1="0" y1="-80" x2="0" y2="110"/>
    <!-- Traverse horizontale -->
    <line x1="-80" y1="-80" x2="80" y2="-80"/>
    <!-- Arc bas gauche -->
    <path d="M -110,50 A 110,110 0 0 1 0,110"/>
    <!-- Arc bas droit -->
    <path d="M 0,110 A 110,110 0 0 1 110,50"/>
    <!-- Pointe gauche -->
    <line x1="-110" y1="50" x2="-80" y2="20"/>
    <line x1="-110" y1="50" x2="-80" y2="70"/>
    <!-- Pointe droite -->
    <line x1="110" y1="50" x2="80" y2="20"/>
    <line x1="110" y1="50" x2="80" y2="70"/>
  </g>
</svg>
