<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_mobile.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/logo_mobile.png?v=2" />
    <link rel="apple-touch-icon" href="/logo_mobile.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SailingLoc Location de bateaux entre particuliers dans les ports français et européens et internationaux" />
    <meta name="theme-color" content="#2563FF" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>SailingLoc:Location de bateaux entre particuliers, voiliers, yachts, catamarans, etc.</title>
  <!-- Script anti-FOUC : applique le thème AVANT que React ne rende -->
  <script>
    (function () {
      var stored = localStorage.getItem('sailingloc_theme')
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.classList.add('dark')
      }
      var lang = localStorage.getItem('sailingloc_lang')
      if (lang) {
        document.documentElement.lang = lang
      }
    })()
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
