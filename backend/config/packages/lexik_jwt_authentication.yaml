lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: '%env(int:JWT_TTL)%'
    user_id_claim: email
    set_cookies: {}
    token_extractors:
        authorization_header:
            enabled: true
            prefix: Bearer
            name: Authorization
        # Nécessaire pour les EventSource (SSE) qui ne peuvent pas envoyer de headers custom
        query_parameter:
            enabled: true
            name: token
