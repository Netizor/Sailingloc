parameters:
    jwt_ttl: '%env(int:JWT_TTL)%'
    vapid_public_key: '%env(VAPID_PUBLIC_KEY)%'
    vapid_private_key: '%env(VAPID_PRIVATE_KEY)%'
    vapid_subject: '%env(VAPID_SUBJECT)%'
    jwt_refresh_ttl: '%env(int:JWT_REFRESH_TTL)%'
    stripe_secret_key: '%env(STRIPE_SECRET_KEY)%'
    stripe_webhook_secret: '%env(STRIPE_WEBHOOK_SECRET)%'
    stripe_platform_fee_percent: '%env(int:STRIPE_PLATFORM_FEE_PERCENT)%'
    cloudinary_cloud_name: '%env(CLOUDINARY_CLOUD_NAME)%'
    cloudinary_api_key: '%env(CLOUDINARY_API_KEY)%'
    cloudinary_api_secret: '%env(CLOUDINARY_API_SECRET)%'
    resend_api_key: '%env(RESEND_API_KEY)%'
    mail_from: '%env(MAIL_FROM)%'
    frontend_url: '%env(FRONTEND_URL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\StripeService:
        arguments:
            $secretKey: '%stripe_secret_key%'
            $webhookSecret: '%stripe_webhook_secret%'
            $platformFeePercent: '%stripe_platform_fee_percent%'

    App\Service\CloudinaryService:
        arguments:
            $cloudName: '%cloudinary_cloud_name%'
            $apiKey: '%cloudinary_api_key%'
            $apiSecret: '%cloudinary_api_secret%'

    App\Service\EmailService:
        arguments:
            $resendApiKey: '%resend_api_key%'
            $mailFrom: '%mail_from%'
            $frontendUrl: '%frontend_url%'

    App\Service\PushService:
        arguments:
            $vapidPublicKey: '%vapid_public_key%'
            $vapidPrivateKey: '%vapid_private_key%'
            $vapidSubject: '%vapid_subject%'

    App\Service\AuthService:
        arguments:
            $jwtRefreshTtl: '%jwt_refresh_ttl%'

    App\EventListener\JWTCreatedListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_created, method: onJWTCreated }

    App\EventListener\AuthenticationSuccessListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_authentication_success, method: onAuthenticationSuccess }

    App\EventListener\ExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }
